name: Build FocusBlocker EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore FocusBlocker.sln

      - name: Build Release
        run: msbuild FocusBlocker.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FocusBlocker-EXE
          path: FocusBlocker/bin/Release/FocusBlocker.exe
          if-no-files-found: error
