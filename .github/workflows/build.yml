name: Build FocusBlocker EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore FocusBlocker/FocusBlocker.csproj

      - name: Build Release
        run: dotnet build FocusBlocker/FocusBlocker.csproj -c Release --no-restore

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FocusBlocker-EXE
          path: FocusBlocker/bin/Release/net48/FocusBlocker.exe
          if-no-files-found: error
